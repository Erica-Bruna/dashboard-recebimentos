<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow | REACH</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS para Excel/CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-gray-100 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="w-full border-b border-gray-800 bg-[#141414] px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div>
                <h1 class="font-semibold text-lg tracking-tight text-white">Recebimentos <span class="text-[#FF6600] font-light">REACH</span></h1>
                <!-- 1. Data e Hora da Última Atualização -->
                <p id="infoAtualizacao" class="text-xs text-gray-400">Nenhuma planilha carregada</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <label class="cursor-pointer bg-[#FF6600] hover:bg-[#E65C00] text-black font-medium text-xs px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Carregar Planilha (Excel/CSV)
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="processarExcel(event)">
            </label>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

        <!-- CARDS DE RESUMO (KPIs) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-[#18181b] border border-gray-800 rounded-xl p-5 flex flex-col justify-between">
                <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Total a Receber (Período)</span>
                <div class="flex items-baseline justify-between mt-2">
                    <span id="kpiReceber" class="text-2xl font-bold text-white">R$ 0,00</span>
                </div>
            </div>

            <div class="bg-[#18181b] border border-gray-800 rounded-xl p-5 flex flex-col justify-between">
                <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Total Recebido (Período)</span>
                <div class="flex items-baseline justify-between mt-2">
                    <span id="kpiRecebido" class="text-2xl font-bold text-white">R$ 0,00</span>
                </div>
            </div>

            <div class="bg-[#18181b] border border-gray-800 rounded-xl p-5 flex flex-col justify-between">
                <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Total Atrasado (Período)</span>
                <div class="flex items-baseline justify-between mt-2">
                    <span id="kpiAtrasado" class="text-2xl font-bold text-red-400">R$ 0,00</span>
                </div>
            </div>
        </div>

        <!-- BARRA DE FILTROS E DATAS -->
        <div class="bg-[#18181b] border border-gray-800 rounded-xl p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex-1 min-w-[240px]">
                    <input type="text" id="searchInput" oninput="aplicarFiltros()" placeholder="Pesquisar cliente (Nome Fantasia)..." class="w-full bg-[#121214] border border-gray-800 rounded-lg px-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-[#FF6600]">
                </div>
                
                <div class="flex items-center gap-2">
                    <select id="filtroStatus" onchange="aplicarFiltros()" class="bg-[#121214] border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none">
                        <option value="todos">Todos os Status</option>
                        <option value="Pendente">A Receber</option>
                        <option value="Pago">Recebido</option>
                        <option value="Vencido">Atrasado</option>
                    </select>
                </div>
            </div>

            <!-- Filtros de Período e 2. Filtro de Razão Social ao lado -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-gray-800">
                <div class="flex items-center gap-3 flex-wrap">
                    <div class="flex items-center gap-2 bg-[#121214] border border-gray-800 rounded-lg px-3 py-1.5">
                        <span class="text-xs text-gray-400 font-medium">De:</span>
                        <input type="date" id="dataInicio" onchange="aplicarFiltros()" class="bg-transparent text-sm text-gray-200 focus:outline-none">
                    </div>
                    <span class="text-gray-500">até</span>
                    <div class="flex items-center gap-2 bg-[#121214] border border-gray-800 rounded-lg px-3 py-1.5">
                        <span class="text-xs text-gray-400 font-medium">Até:</span>
                        <input type="date" id="dataFim" onchange="aplicarFiltros()" class="bg-transparent text-sm text-gray-200 focus:outline-none">
                    </div>

                    <!-- Filtro de Razão Social -->
                    <div class="flex items-center gap-2 bg-[#121214] border border-gray-800 rounded-lg px-3 py-1.5 min-w-[220px]">
                        <span class="text-xs text-gray-400 font-medium">Razão Social:</span>
                        <select id="filtroRazaoSocial" onchange="aplicarFiltros()" class="bg-transparent text-sm text-gray-200 focus:outline-none w-full">
                            <option value="todos">Todas as Razões Sociais</option>
                        </select>
                    </div>

                    <!-- Botão Limpar Filtros -->
                    <button onclick="limparFiltros()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium text-xs px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 border border-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        Limpar Filtros
                    </button>
                </div>

                <div class="text-xs text-gray-400">
                    Mostrando <span id="contadorRegistros" class="font-semibold text-white">0</span> registros
                </div>
            </div>
        </div>

        <!-- CONTEÚDO DA TABELA E GRÁFICO -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-[#18181b] border border-gray-800 rounded-xl overflow-hidden flex flex-col">
                <div class="px-5 py-4 border-b border-gray-800 flex justify-between items-center">
                    <h3 id="tituloTabela" class="text-sm font-semibold text-gray-200">Recebimentos</h3>
                </div>
                <div class="overflow-x-auto max-h-[400px]">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-[#121214] text-gray-400 uppercase text-xs sticky top-0 border-b border-gray-800">
                            <tr>
                                <th class="px-5 py-3 font-medium">Cliente</th>
                                <th class="px-5 py-3 font-medium">Vencimento</th>
                                <th class="px-5 py-3 font-medium">NF</th>
                                <th class="px-5 py-3 font-medium">Valor</th>
                                <th class="px-5 py-3 font-medium">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaDados" class="divide-y divide-gray-800 text-gray-300">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-[#18181b] border border-gray-800 rounded-xl p-5 flex flex-col">
                <h3 class="text-sm font-semibold text-gray-200 mb-4 text-center">Status dos Títulos</h3>
                <div class="relative flex-1 w-full h-64 flex items-center justify-center">
                    <canvas id="chartStatus"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT -->
    <script>
        let dadosGlobais = [];
        let chartStatusInstancia = null;

        function parseValor(valor) {
            if (!valor) return 0;
            if (typeof valor === 'number') return valor;
            return parseFloat(valor.toString().replace(/\./g, '').replace(',', '.')) || 0;
        }

        function serialParaData(serial) {
            if (!serial) return '';
            if (typeof serial === 'string' && serial.includes('-')) {
                return serial.split('T')[0];
            }
            const num = parseFloat(serial);
            if (isNaN(num)) return serial.toString().split(' ')[0];
            const dataBase = new Date(1899, 11, 30);
            dataBase.setDate(dataBase.getDate() + num);
            return dataBase.toISOString().split('T')[0];
        }

        function processarExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                if (json.length < 2) {
                    alert('A planilha parece estar vazia.');
                    return;
                }

                const headers = json[0];
                const linhasDados = json.slice(1);

                dadosGlobais = linhasDados.map(row => {
                    const obj = {};
                    headers.forEach((h, index) => {
                        if (h) obj[h.toString().trim()] = row[index];
                    });
                    return obj;
                }).filter(item => item['Valor'] !== undefined || item['Entidade'] !== undefined);

                mapearDadosRecebimento();
                popularSelectRazaoSocial();
                definirDatasPadrao();
                atualizarHoraAtualizacao();
                aplicarFiltros();
                alert('Planilha carregada com sucesso!');
            };
            reader.readAsArrayBuffer(file);
        }

        function atualizarHoraAtualizacao() {
            const agora = new Date();
            const dataFormatada = agora.toLocaleDateString('pt-BR');
            const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('infoAtualizacao').innerText = `Última atualização: ${dataFormatada} às ${horaFormatada}`;
        }

        function popularSelectRazaoSocial() {
            const select = document.getElementById('filtroRazaoSocial');
            select.innerHTML = '<option value="todos">Todas as Razões Sociais</option>';
            
            const razoes = [...new Set(dadosGlobais.map(d => d.razaoSocial).filter(r => r && r !== ''))].sort();
            razoes.forEach(razao => {
                const opt = document.createElement('option');
                opt.value = razao;
                opt.textContent = razao;
                select.appendChild(opt);
            });
        }

        function definirDatasPadrao() {
            const datas = dadosGlobais.map(d => d.data).filter(d => d && d !== '').sort();
            if (datas.length > 0) {
                const hoje = new Date();
                const anoAtual = hoje.getFullYear();
                const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
                
                document.getElementById('dataInicio').value = `${anoAtual}-${mesAtual}-01`;
                document.getElementById('dataFim').value = `${anoAtual}-${mesAtual}-31`;
            }
        }

        function mapearDadosRecebimento() {
            dadosGlobais = dadosGlobais.map(item => {
                // Tenta buscar colunas do Omie ou da Planilha Mãe
                const entidade = item['Entidade'] || item['Cliente (Nome Fantasia)'] || item['Cliente'] || 'Não Identificado';
                const razaoSocial = item['Cliente (Razão Social)'] || item['Razão Social'] || entidade;
                const vencimentoBruto = item['Vencimento'] || item['Previsão de Recebimento'] || '2026-10-01';
                const dataFormatada = serialParaData(vencimentoBruto);
                const nf = item['Documento / NF'] || item['Nota Fiscal / Cupom Fiscal'] || item['Nota Fiscal'] || '-';
                const situacao = item['Situação'] || item['Status'] || 'Pendente';
                const valor = parseValor(item['Valor'] || item['Valor Líquido'] || item['Valor da Conta']);
                
                let statusNorm = 'Pendente';
                const sitLower = situacao.toString().toLowerCase();
                const hoje = new Date();
                hoje.setHours(0,0,0,0);
                const dataVen = new Date(dataFormatada);

                if (sitLower.includes('pago') || sitLower.includes('recebido') || sitLower.includes('liquidado')) {
                    statusNorm = 'Pago';
                } else if (sitLower.includes('atrasado') || (dataVen < hoje && !isNaN(dataVen))) {
                    statusNorm = 'Vencido';
                } else {
                    statusNorm = 'Pendente';
                }

                return {
                    data: dataFormatada,
                    entidade: entidade,
                    razaoSocial: razaoSocial,
                    nf: nf,
                    valor: valor,
                    status: statusNorm
                };
            }).filter(item => item.valor > 0);
        }

        function limparFiltros() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filtroStatus').value = 'todos';
            document.getElementById('filtroRazaoSocial').value = 'todos';
            document.getElementById('dataInicio').value = '';
            document.getElementById('dataFim').value = '';
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const busca = document.getElementById('searchInput').value.toLowerCase();
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;
            const statusFiltro = document.getElementById('filtroStatus').value;
            const razaoFiltro = document.getElementById('filtroRazaoSocial').value;

            const dadosFiltrados = dadosGlobais.filter(item => {
                const matchBusca = item.entidade.toLowerCase().includes(busca);
                const matchStatus = statusFiltro === 'todos' || item.status.toLowerCase() === statusFiltro.toLowerCase();
                const matchRazao = razaoFiltro === 'todos' || item.razaoSocial === razaoFiltro;
                
                let matchData = true;
                if (dataInicio && item.data < dataInicio) matchData = false;
                if (dataFim && item.data > dataFim) matchData = false;

                return matchBusca && matchStatus && matchRazao && matchData;
            });

            // Atualiza o título dinâmico com o período selecionado
            if (dataInicio && dataFim) {
                const partsInicio = dataInicio.split('-');
                const partsFim = dataFim.split('-');
                document.getElementById('tituloTabela').innerText = `Recebimentos de ${partsInicio[2]}/${partsInicio[1]}/${partsInicio[0]} até ${partsFim[2]}/${partsFim[1]}/${partsFim[0]}`;
            } else {
                document.getElementById('tituloTabela').innerText = `Recebimentos (Geral)`;
            }

            atualizarKPIs(dadosFiltrados);
            atualizarTabela(dadosFiltrados);
            atualizarGrafico(dadosFiltrados);
            document.getElementById('contadorRegistros').innerText = dadosFiltrados.length;
        }

        function atualizarKPIs(dados) {
            let totalReceber = 0;
            let totalRecebido = 0;
            let totalAtrasado = 0;

            dados.forEach(item => {
                if (item.status === 'Pendente') totalReceber += item.valor;
                if (item.status === 'Pago') totalRecebido += item.valor;
                if (item.status === 'Vencido') totalAtrasado += item.valor;
            });

            document.getElementById('kpiReceber').innerText = formatarMoeda(totalReceber);
            document.getElementById('kpiRecebido').innerText = formatarMoeda(totalRecebido);
            document.getElementById('kpiAtrasado').innerText = formatarMoeda(totalAtrasado);
        }

        function atualizarTabela(dados) {
            const tbody = document.getElementById('tabelaDados');
            tbody.innerHTML = '';

            if (dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-6 text-center text-gray-500">Nenhum registro encontrado para esta seleção.</td></tr>`;
                return;
            }

            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors";

                let statusBadge = '';
                if (item.status === 'Pago') {
                    statusBadge = '<span class="px-2 py-0.5 text-xs rounded bg-emerald-950 text-emerald-400 border border-emerald-800/50">Recebido</span>';
                } else if (item.status === 'Vencido') {
                    statusBadge = '<span class="px-2 py-0.5 text-xs rounded bg-red-950 text-red-400 border border-red-800/50">Atrasado</span>';
                } else {
                    statusBadge = '<span class="px-2 py-0.5 text-xs rounded bg-blue-950 text-blue-400 border border-blue-800/50">A Receber</span>';
                }

                tr.innerHTML = `
                    <td class="px-5 py-3.5 font-medium">${item.entidade}</td>
                    <td class="px-5 py-3.5 text-gray-400 text-xs">${item.data.split('-').reverse().join('/')}</td>
                    <td class="px-5 py-3.5 text-gray-400">${item.nf}</td>
                    <td class="px-5 py-3.5 font-semibold">${formatarMoeda(item.valor)}</td>
                    <td class="px-5 py-3.5">${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function atualizarGrafico(dados) {
            let qtdRecebidos = dados.filter(d => d.status === 'Pago').length;
            let qtdAReceber = dados.filter(d => d.status === 'Pendente').length;
            let qtdAtrasados = dados.filter(d => d.status === 'Vencido').length;

            const ctxStatus = document.getElementById('chartStatus').getContext('2d');
            if (chartStatusInstancia) chartStatusInstancia.destroy();

            chartStatusInstancia = new Chart(ctxStatus, {
                type: 'doughnut',
                data: {
                    labels: ['Recebidos', 'A Receber', 'Atrasados'],
                    datasets: [{
                        data: [qtdRecebidos, qtdAReceber, qtdAtrasados],
                        backgroundColor: ['#FF6600', '#0070F3', '#EF4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#aaa', boxWidth: 12 } }
                    },
                    cutout: '70%'
                }
            });
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
    </script>
</body>
</html>
